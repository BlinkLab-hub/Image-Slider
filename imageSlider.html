<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE SLIDER</title>
    <link rel="stylesheet" href="imageSlider.css">
    <script src="imageSlider.js" defer></script>
</head>

<body>
    <section class="container">
        <figure>
            <img src="image1.jpeg" alt="image1" width="600" height="1066">
            <figcaption>Image 1</figcaption>
        </figure>
        <figure>
            <img src="image2.jpeg" alt="image2" width="648" height="1066">
            <figcaption>Image 2</figcaption>
        </figure>
        <figure>
            <img src="image3.jpeg" alt="image3" width="736" height="1310">
            <figcaption>Image 3</figcaption>
        </figure>
        <figure>
            <img src="image4.jpeg" alt="image4" width="736" height="1308">
            <figcaption>Image 4</figcaption>
        </figure>
        <figure>
            <img src="image5.jpeg" alt="image5" width="736" height="1301">
            <figcaption>Image 5</figcaption>
        </figure>
        <figure>
            <img src="image6.jpeg" alt="image6" width="736" height="1308">
            <figcaption>Image 6</figcaption>
        </figure>
        <button id="prevBtn" onclick="previousImage()">&#10094</button>
        <button id="nxtBtn" onclick="nextImage()">&#10095</button>
    </section>

</body>

</html>
